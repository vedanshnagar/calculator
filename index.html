<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ambient background illumination shapes -->
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <!-- Main Glassmorphic Panel -->
    <div class="calculator">
        <div class="display-container">
            <div class="history-display" id="history"></div>
            <div class="current-display" id="display">0</div>
        </div>

        <div class="grid">
            <!-- Row 1 -->
            <button class="function" id="btn-ac">AC</button>
            <button class="function" id="btn-del">⌫</button>
            <button class="function" id="btn-mod">%</button>
            <button class="operator" id="btn-div">÷</button>

            <!-- Row 2 -->
            <button class="btn-num">7</button>
            <button class="btn-num">8</button>
            <button class="btn-num">9</button>
            <button class="operator" id="btn-mul">×</button>

            <!-- Row 3 -->
            <button class="btn-num">4</button>
            <button class="btn-num">5</button>
            <button class="btn-num">6</button>
            <button class="operator" id="btn-sub">−</button>

            <!-- Row 4 -->
            <button class="btn-num">1</button>
            <button class="btn-num">2</button>
            <button class="btn-num">3</button>
            <button class="operator" id="btn-add">+</button>

            <!-- Row 5 -->
            <button class="btn-num">00</button>
            <button class="btn-num">0</button>
            <button class="btn-num">.</button>
            <button class="equals" id="btn-eq">=</button>
        </div>
    </div>

    
    

    <script src="script.js"></script>
</body>
</html>
